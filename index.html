<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE LAST ROOM — Creator Build</title>
<style>
:root{--bg:#030306;--panel:#0e0b10;--red:#ef2654;--text:#f1ebef;--muted:#948b91;--line:#4b2a36;--gold:#d8bf73;--green:#8fd3ad}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020204;color:var(--text);font-family:Georgia,serif}
body{background:radial-gradient(circle at 50% 0,#241018 0,#09070a 38%,#020204 78%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.07;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 3px 4px);mix-blend-mode:screen}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:69;background:radial-gradient(ellipse at center,transparent 47%,rgba(0,0,0,.84) 100%)}
#app{max-width:1120px;min-height:100vh;margin:auto;padding:22px;position:relative}
h1{text-align:center;font-size:clamp(46px,9vw,96px);letter-spacing:.14em;margin:20px 0 8px;text-shadow:0 0 28px var(--red)}
h2{color:#ff3760;letter-spacing:.07em;margin-top:0}
.kicker{text-align:center;font:11px Arial,sans-serif;letter-spacing:.32em;color:#a89ba1;text-transform:uppercase}
.subtitle{text-align:center;color:var(--muted);line-height:1.8;max-width:700px;margin:0 auto 30px}
.top{display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:22px;font:11px Arial,sans-serif;letter-spacing:.07em;color:#aaa}
.story{min-height:350px;font-size:19px;line-height:1.82}
.story strong{color:#ff3b64}
.panel{border:1px solid var(--line);background:rgba(12,9,13,.84);padding:15px;margin:14px 0;border-radius:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{margin:0}
button,input{font:inherit}
button{width:100%;padding:14px 16px;margin:7px 0;background:#130f14;border:1px solid #5a313e;color:#fff;border-radius:5px;text-align:left;cursor:pointer;transition:.15s}
button:hover{border-color:var(--red);background:#291019;transform:translateX(3px)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.primary{text-align:center;background:#73112d;border-color:#bd294d;font-weight:bold;letter-spacing:.08em}
input{width:100%;padding:13px;background:#08070a;border:1px solid #59313e;color:#fff;border-radius:4px}
.inv{border-top:1px solid var(--line);margin-top:20px;padding-top:12px;font:11px Arial,sans-serif;color:#aaa}
.item{display:inline-block;border:1px solid #4d3038;padding:6px 8px;margin:3px;border-radius:4px;color:#eee}
.muted{color:var(--muted)}.danger{color:#ff315b}.ok{color:var(--green)}.gold{color:var(--gold)}.center{text-align:center}
.batteryWrap{position:fixed;right:18px;bottom:18px;z-index:75;width:150px;height:9px;background:#1a0e12;border:1px solid #5a3c28;border-radius:6px;overflow:hidden;box-shadow:0 0 12px rgba(0,0,0,.8)}.batteryWrap i{display:block;height:100%;background:#d5b75e;transition:width .25s}.flashHud{position:fixed;right:18px;bottom:32px;z-index:75;font:11px Arial,sans-serif;color:#e6d18b;background:rgba(5,5,7,.82);padding:5px 8px;border-radius:4px}
#dark{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 50%,transparent 0 10%,rgba(0,0,0,.98) 34%,#000 73%);opacity:0;pointer-events:none;transition:.18s}
#dark.on{opacity:1}
/* Die Dunkelheit verdunkelt die Szene, blockiert aber keine Steuerung. */
#blackoutTimer{position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:90;display:none;min-width:220px;text-align:center;background:rgba(8,3,7,.95);border:1px solid #9d2648;padding:10px 18px;border-radius:8px;box-shadow:0 0 25px #20050b;color:#f7c3cc;pointer-events:none}
#blackoutTimer.on{display:block}
#blackoutTimer small{display:block;font:10px Arial,sans-serif;letter-spacing:.12em;margin-bottom:5px}
#blackoutTimer strong{font:700 31px monospace;color:#ff4264}
@media(max-width:600px){#blackoutTimer{top:95px}}
#scare{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center;font-size:min(44vw,320px);text-shadow:0 0 34px #ff1c4e}
#scare.on{display:flex;animation:jolt .42s ease-out}
@keyframes jolt{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:120;background:#130e13;border:1px solid #753149;padding:10px 14px;border-radius:5px;font:12px Arial,sans-serif;color:#ddd;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
.symbols{text-align:center;font-size:clamp(32px,6vw,58px);letter-spacing:.22em;margin:18px 0;color:#e9dfe3}
.puzzleBoard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:600px;margin:20px auto}
.piece{aspect-ratio:4/3;border:1px solid #623544;background:#161116;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,5vw,50px);cursor:pointer;user-select:none}
.piece.sel{outline:2px solid #ff315b;box-shadow:0 0 16px #7c0d2b}
.note{font-family:"Courier New",monospace;background:#0a090c;border-left:3px solid #8d1535;padding:12px 14px}
.codeRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:18px auto}
.codeRow input{text-align:center;font-size:24px}
@media(max-width:700px){#app{padding:15px}.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr 1fr;gap:7px}.story{font-size:17px;min-height:390px}.piece{font-size:30px}}

.creatorCard{max-width:720px;margin:18px auto;border:1px solid #6a3041;background:rgba(12,8,12,.92);padding:18px;border-radius:6px}
.warning{font-family:Arial,sans-serif;font-size:13px;line-height:1.7;color:#c8bdc2}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:620px;margin:22px auto}
.stat{border:1px solid #4b2a36;background:#0b090c;padding:14px;text-align:center;font-family:Arial,sans-serif}
.stat b{display:block;font-size:24px;color:#ff365f;margin-top:5px}
#creature{position:fixed;right:-180px;bottom:0;z-index:58;width:150px;height:55vh;opacity:0;pointer-events:none;
background:linear-gradient(90deg,transparent,rgba(0,0,0,.98));filter:drop-shadow(0 0 18px #5b0a20);transition:.35s}
#creature:after{content:"●  ●";position:absolute;top:24%;right:25px;color:#eee;font-size:18px;letter-spacing:13px;text-shadow:0 0 12px #fff}
#creature.peek{right:0;opacity:.92}
.fakeCrash{position:fixed;inset:0;z-index:200;background:#050505;color:#d8d8d8;font:15px "Courier New",monospace;padding:7vw;display:none}
.fakeCrash.on{display:block}
@media(max-width:700px){.statGrid{grid-template-columns:1fr}}


#dollScare{position:fixed;inset:0;z-index:250;background:#000;display:none;align-items:center;justify-content:center;overflow:hidden}
#dollScare.on{display:flex;animation:dollFlash .62s steps(2,end)}
#dollScare img{width:100vw;height:100vh;object-fit:cover;filter:contrast(1.35) brightness(.7) saturate(.65);animation:dollZoom .62s ease-out}
@keyframes dollZoom{0%{transform:scale(.55)}35%{transform:scale(1.28)}100%{transform:scale(1.05)}}
@keyframes dollFlash{0%,30%,70%{filter:brightness(1)}15%,55%{filter:brightness(2.5)}}


#flashFixed{
 position:fixed;
 top:12px;
 right:12px;
 z-index:9999;
 padding:7px 10px;
 margin:0;
 background:rgba(5,5,7,.94);
 border:1px solid #5a3c28;
 border-radius:5px;
 color:#e6d18b;
 font:12px Arial,sans-serif;
 line-height:1;
 box-shadow:0 0 12px rgba(0,0,0,.8);
 pointer-events:none;
}
.batteryWrap,.flashHud{display:none!important}
@media(max-width:700px){
 #flashFixed{top:7px;right:7px;font-size:10px;padding:5px 7px}
}

#handScare{
 position:fixed;inset:0;z-index:270;display:none;align-items:flex-end;justify-content:center;
 background:rgba(0,0,0,.96);overflow:hidden;pointer-events:none
}
#handScare.on{display:flex}
#handScare .hand{
 font-size:min(70vw,520px);line-height:.8;filter:grayscale(1) contrast(2) brightness(.55) drop-shadow(0 0 24px #d81442);
 transform:translateY(120%) scale(.6);animation:handRush .85s cubic-bezier(.15,.9,.2,1)
}
@keyframes handRush{
 0%{transform:translateY(120%) scale(.55)}
 55%{transform:translateY(8%) scale(1.18)}
 100%{transform:translateY(-7%) scale(1.38)}
}
.sanityLow{animation:sanityPulse .8s infinite}
@keyframes sanityPulse{50%{filter:contrast(1.2) brightness(.72)}}
.musicWait{font-family:"Courier New",monospace;letter-spacing:.12em;color:#9c8f95;min-height:130px}


/* 2.0 ALPHA */
#introOverlay,#musicOverlay{position:fixed;inset:0;z-index:600;background:radial-gradient(ellipse at center,#211018,#030204 76%);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#e4c7c9}
#introOverlay.on,#musicOverlay.on{display:flex}
.introInner{max-width:700px;width:100%}.whisperLine{font:clamp(20px,4vw,38px) Georgia,serif;letter-spacing:.07em;text-shadow:0 0 20px #8c1e37;min-height:140px;animation:whisperFade 3s ease-in-out}
@keyframes whisperFade{0%{opacity:0;transform:scale(.96)}25%,75%{opacity:1}100%{opacity:.3}}
.bloodbar{display:inline-block;color:#e08a94;border:1px solid #703039;padding:4px 7px;margin-left:6px}
#bloodBtn{border-color:#762d42;color:#e8a2ae}.bloodShade{position:fixed;inset:0;pointer-events:none;z-index:80;box-shadow:inset 0 0 90px rgba(125,0,25,.36)}
.portrait{position:relative;width:min(100%,460px);margin:18px auto;background:linear-gradient(145deg,#5e4335,#1c1417);border:13px ridge #725139;overflow:hidden;box-shadow:0 0 25px #100708}
.portrait svg{width:100%;height:100%}.portraitGrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none}.portraitGrid span{border:1px dashed rgba(255,220,180,.25)}
#musicOverlay .whisperLine{min-height:75px;font-size:clamp(18px,3vw,29px)}
.musicDoll{font-size:80px;filter:drop-shadow(0 0 22px #a52641);animation:musicTurn 8s ease-in-out infinite alternate}@keyframes musicTurn{to{transform:rotate(13deg) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.whisperLine,.musicDoll{animation:none}}

/* Porträt-Enthüllung: langsame Verwandlung, einmaliger Schreckmoment */
#portraitScene{position:fixed;inset:0;z-index:850;display:none;align-items:center;justify-content:center;flex-direction:column;background:#060407;color:#ead9d7;padding:16px;text-align:center;overflow:hidden}
#portraitScene.on{display:flex}
#portraitScene .stageFrame{position:relative;width:min(85vw,780px);aspect-ratio:766/1024;max-height:72vh;border:13px ridge #62452d;box-shadow:0 0 35px #000;overflow:hidden;background:#1b1014}
#portraitScene .stageFrame img{width:100%;height:100%;object-fit:contain;transition:filter 3s ease,transform 3s ease}
#portraitScene.corrupt .stageFrame img{filter:contrast(2.5) grayscale(.8) sepia(.8) brightness(.44) hue-rotate(295deg);transform:scale(1.11)}
#portraitScene .faceDark{position:absolute;inset:0;opacity:0;transition:opacity 2.5s ease;background:radial-gradient(ellipse at 33% 34%,#000 0 5%,transparent 13%),radial-gradient(ellipse at 62% 34%,#000 0 5%,transparent 13%),radial-gradient(ellipse at center,transparent 10%,rgba(70,0,15,.5) 100%);mix-blend-mode:multiply}
#portraitScene.corrupt .faceDark{opacity:1}
#portraitScene .sceneCaption{min-height:65px;margin-top:18px;font:clamp(16px,2.5vw,25px) Georgia,serif;letter-spacing:.05em}
#portraitScene .scareFace{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
#portraitScene.attack .scareFace{opacity:1;animation:portraitLunge .56s cubic-bezier(.13,.7,.2,1) forwards}
@keyframes portraitLunge{0%{transform:scale(.35);filter:blur(5px)}55%{transform:scale(1.8);filter:contrast(1.6)}100%{transform:scale(3.4);filter:brightness(.3)}}
#portraitScene.blackout{background:#000}
#portraitScene.blackout .stageFrame,#portraitScene.blackout .sceneCaption,#portraitScene.blackout .scareFace{visibility:hidden}
#portraitScene button{margin-top:12px}
@media(prefers-reduced-motion:reduce){#portraitScene.attack .scareFace{animation:none;opacity:1}}

/* Spieluhr: Der Schreckmoment muss über der gesperrten Szene liegen. */
body.musicBoxActive #dollScare{z-index:750}
body.musicBoxActive #dollScare img{content:url("vorhangmann-jumpscare.jpg");filter:contrast(1.65) brightness(.82) saturate(.75)}
#musicEscape{border-color:#8a3347;color:#f1b0ba}

/* Taschenlampen-Spinne: eigenständiger Jumpscare */
#spiderScene{position:fixed;inset:0;z-index:960;display:none;align-items:center;justify-content:center;background:#020203;color:#e6d8d6;overflow:hidden;text-align:center}
#spiderScene.on{display:flex}
#spiderScene .spiderIntro{font:clamp(19px,3vw,30px) Georgia,serif;padding:24px;max-width:700px}
#spiderScene .spiderVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;filter:contrast(1.45) brightness(.7)}
#spiderScene.pounce .spiderVideo{opacity:1}
@keyframes spiderLunge{0%{transform:scale(.18) translateY(65%);filter:blur(8px) brightness(.3)}42%{transform:scale(.85);filter:blur(0) brightness(.9)}100%{transform:scale(2.7);filter:brightness(.25)}}
#spiderScene .spiderQuestion{display:none;max-width:740px;padding:25px;font:clamp(23px,4.2vw,44px) Georgia,serif;letter-spacing:.04em;line-height:1.5;text-shadow:0 0 22px #6d1828}
#spiderScene.question .spiderIntro,#spiderScene.question .spiderVideo{display:none}
#spiderScene.question .spiderQuestion{display:block;animation:spiderWords 3s ease both}
@keyframes spiderWords{from{opacity:0;filter:blur(7px)}to{opacity:1;filter:blur(0)}}
#spiderScene.blackout .spiderIntro,#spiderScene.blackout .spiderVideo{display:none}
@media(prefers-reduced-motion:reduce){#spiderScene.pounce .spiderVideo{animation:none;opacity:1}#spiderScene.question .spiderQuestion{animation:none}}
#portraitScene .sceneCaption{display:none}
#portraitScene #portraitSceneSkip{position:absolute;bottom:10px;right:10px;opacity:0;transition:opacity .2s}
#portraitScene #portraitSceneSkip:focus-visible{opacity:1}

.clockFace{position:relative;margin:12px auto;width:min(240px,66vw);aspect-ratio:1;border:10px ridge #82664c;border-radius:50%;background:radial-gradient(circle,#d7c4a0,#a88e68);box-shadow:0 0 30px #000;color:#2b1b17}
.clockFace .hand{position:absolute;left:50%;bottom:50%;width:5px;height:31%;background:#251811;transform-origin:bottom center;border-radius:3px}
.clockFace .hand.hour{height:23%;width:8px}
.clockFace .pin{position:absolute;top:47%;left:47%;height:6%;width:6%;background:#321a16;border-radius:50%}
.clockFace .numeral{position:absolute;left:50%;top:50%;font:17px Georgia,serif;transform:translate(-50%,-50%)}
.clockControls{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:15px auto}
.clockControls label{display:flex;align-items:center;gap:9px}
.clockControls select{width:95px;padding:9px;background:#1c1515;color:#e6d7cd;border:1px solid #88644c}
#letterOverlay{position:fixed;inset:0;z-index:820;display:none;background:rgba(4,3,5,.97);overflow:auto;padding:25px;align-items:center;justify-content:center}
#letterOverlay.on{display:flex}
#letterOverlay .letterPage{max-width:660px;width:100%;padding:25px;background:#d1bc98;color:#39231b;border:10px ridge #65422d;box-shadow:0 0 60px #000}
#letterOverlay .letterPage p{font:clamp(18px,2.8vw,24px)/1.6 Georgia,serif;white-space:pre-line}
#letterOverlay button{margin:9px 6px 0 0}
#app .blackMirrorPane{height:220px;max-width:410px;margin:10px auto 20px;border:12px ridge #56434c;border-radius:48% 48% 12% 12%;background:radial-gradient(ellipse at 50% 45%,#08090e 0%,#000 70%);box-shadow:inset 0 0 40px #130c19,0 0 28px #09080b;animation:mirrorFade 2.8s ease-out both}
@keyframes mirrorFade{from{background:#777;filter:brightness(1)}to{filter:brightness(.3)}}
</style>
</head>
<body>
<div id="flashFixed">🔦 <span id="flashPercent">100%</span></div><div id="blackoutTimer" role="status" aria-live="off" aria-label="Verbleibende Zeit ohne Batterie"><small>LICHT AUS · DER VORHANGMANN KOMMT</small><strong id="blackoutSeconds">00:30</strong></div><div id="dark"></div>
<div id="scare">◉</div>
<div id="toast"></div><div id="creature"></div><div id="fakeCrash" class="fakeCrash"></div><div id="dollScare"><img src="doll-jumpscare.jpg" alt=""></div><div id="handScare"><div class="hand">🖐️</div></div>
<audio id="ritualAudio" src="romina-ritualfluestern.mp3" preload="auto"></audio>
<audio id="music" src="Kellerflur.mp3" loop preload="auto"></audio>
<audio id="introMusic" src="intro-spieluhr-sanft.mp3" preload="auto" loop></audio><audio id="introNoise" src="intro-rauschen.mp3" preload="auto" loop></audio><audio id="daisy" src="spieluhr-mit-fluestern.mp3" preload="auto"></audio><audio id="introAudio" src="intro-romina.mp3" preload="auto"></audio>
<div id="introOverlay" role="dialog" aria-label="Einführung"><div class="introInner"><div class="kicker">DIE VORSTELLUNG BEGINNT</div><div id="introLine" class="whisperLine"></div><button id="introSkip">Intro überspringen</button></div></div><div id="musicOverlay" role="dialog" aria-label="Spieluhr"><div class="introInner"><div class="kicker">DU MUSST ZUHÖREN</div><div class="musicDoll">♟</div><h2>DAISY BELL</h2><div id="whisperLine" class="whisperLine"></div><p id="musicStatus" class="muted">Die Walze dreht sich …</p><button id="musicEscape" style="font-size:12px">🩸 Vorzeitig verlassen (30 Blut)</button></div></div><div id="portraitScene" role="dialog" aria-label="Das vollständige Porträt" aria-modal="true"><div class="stageFrame"><img src="romina-silas-vor-dem-verschwinden.jpg" alt="Romina und Silas auf der alten Bühne"><video id="portraitAnimation" src="puppeteer-befreiung.mp4" preload="auto" playsinline style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#080506"></video><div class="faceDark"></div></div><div id="portraitCaption" class="sceneCaption"></div><button id="portraitSceneSkip" aria-label="Animation überspringen">Animation überspringen</button><img class="scareFace" src="vorhangmann-jumpscare.jpg" alt=""></div><div id="puppeteerEncounter" role="dialog" aria-modal="true" aria-label="The Puppeteer stellt sich vor" style="display:none;position:fixed;inset:0;z-index:920;background:radial-gradient(ellipse,#290912,#030204 75%);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;color:#f5dce3"><img src="vorhangmann-jumpscare.jpg" alt="The Puppeteer" style="width:min(55vw,380px);max-height:55vh;object-fit:contain;filter:brightness(.55) contrast(1.3)"><p id="puppeteerEncounterText" style="font:clamp(18px,3vw,30px) Georgia,serif">Ob versteckt oder nicht … ICH KOMME!</p><button id="puppeteerEncounterContinue" style="display:none">Weitergehen</button></div><div id="spiderScene" role="dialog" aria-modal="true" aria-label="Die Spinne"><div class="spiderIntro" id="spiderIntro">Du hebst die staubige Taschenlampe auf …</div><video class="spiderVideo" id="spiderVideo" src="spinnen-jumpscare.mp4" preload="auto" playsinline aria-label="Eine Spinne springt auf dich zu"></video><div class="spiderQuestion">Bist du dir sicher, dass sie nicht mehr auf dir sitzt?</div></div><div id="letterOverlay" role="dialog" aria-modal="true" aria-label="Rominas Brief"><div class="letterPage"><h2>Der letzte Brief</h2><p id="letterText"></p><button id="letterSkip">Brief vollständig anzeigen</button><button id="letterContinue" style="display:none">Brief anheben</button></div></div><audio id="letterAudio" src="rominas-brief.mp3" preload="auto"></audio><div id="app"></div>
<script>
(function(){
"use strict";

var app=document.getElementById("app"),dark=document.getElementById("dark"),scare=document.getElementById("scare"),toastEl=document.getElementById("toast"),music=document.getElementById("music"),daisy=document.getElementById("daisy");
var S={
 name:"",time:3600,difficulty:"normal",penaltyFactor:1,panic:0,sanity:100,battery:100,light:true,blackoutRemaining:null,items:[],flags:{},pieces:[],room:"Start",
 ended:false,visits:{},wrong:0,sound:true,secrets:0,jumps:0,startStamp:0,creature:0,variant:null,blood:100,sacrifices:0,paidHints:[],locked:false
};
// ROMINA: Die Audioaufnahme wird pro Spieldurchlauf höchstens einmal angefragt.
// Der Worker liefert gecachte Namen. Nicht gecachte Namen bleiben ohne Admin-Token gesperrt.
var ROMINA_VOICE_ENABLED=true;
var ROMINA_VOICE_ENDPOINT="https://the-last-room-romina.lostpuppetplayer.workers.dev/speak";
var rominaWhisperUrl=null,rominaWhisperAudio=null,rominaWhisperPending=false;
var rominaWhisperNext=0,rominaWhisperCount=0;
function prepareRominaWhisper(name){
 if(!ROMINA_VOICE_ENABLED||rominaWhisperPending||rominaWhisperUrl)return;
 // Nur ein kurzer Name; keine freie Texteingabe an den Sprachdienst.
 // Der geheime Admin-Token darf NIEMALS im Browsercode stehen.
 if(!/^[\p{L}][\p{L} '-]{0,23}$/u.test(name))return;
 rominaWhisperPending=true;
 fetch(ROMINA_VOICE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name})})
 .then(function(r){if(!r.ok)throw Error("Romina nicht verfügbar");return r.blob()})
 .then(function(b){if(!b.type.startsWith("audio/")||b.size>1000000)throw Error("Ungültiges Audio");
   rominaWhisperUrl=URL.createObjectURL(b);rominaWhisperAudio=new Audio(rominaWhisperUrl);
   rominaWhisperAudio.volume=.38;rominaWhisperNext=Date.now()+45000;

function musicBox(){
 if(S.locked)return;
 mark('musicBox');S.room='Kinderzimmer';S.locked=true;

 if(kidsSoundTimer)clearTimeout(kidsSoundTimer);
 if(ambienceAudio){ambienceAudio.pause();ambienceAudio.currentTime=0;ambienceAudio=null;}
 var ov=document.getElementById('musicOverlay'),wl=document.getElementById('whisperLine'),
     status=document.getElementById('musicStatus'),escapeBtn=document.getElementById('musicEscape');
 ov.classList.add('on');
 var previousMusicVolume=music.volume;
 music.volume=0; // Daisy Bell + echte Flüsterstimmen sind allein zu hören.
 daisy.pause();daisy.currentTime=0;daisy.volume=.10;
 var done=false,scared=false,ending=false,lastCue=-1,escapeVoice=null,escapeTimer=null;
 // Drei separate Stereo-Flüsterclips: links, rechts, hinter dem Spieler.
 var boxWhispers=['links','rechts','hinten'].map(function(dir){var audio=new Audio('romina-spieluhr-'+dir+'.mp3');audio.volume=.65;return audio;});
var boxWhisperTimers=[],whisperStarted=false,whisperIndex=0,whisperFinished=false,pendingSongEnd=false;
 function startBoxWhisper(){
  if(done||ending||whisperStarted||!S.sound)return;
  whisperStarted=true;whisperIndex=0;
  // Verkettete Wiedergabe statt starrer 7,5-Sekunden-Timer.
  // Der letzte Satz wird vor dem Liedende abgespielt.
  function nextWhisper(){
   if(done||!S.sound||whisperIndex>=boxWhispers.length)return;
   var audio=boxWhispers[whisperIndex++];audio.currentTime=0;
   audio.onended=function(){
    if(whisperIndex<boxWhispers.length){
     boxWhisperTimers.push(setTimeout(nextWhisper,800));
    }else{whisperFinished=true;if(pendingSongEnd)completeSongEnd();}
   };
   audio.play().catch(function(){status.textContent='Rominas Flüstern konnte nicht abgespielt werden.';});
  }
  boxWhisperTimers.push(setTimeout(nextWhisper,500));
 }
 function stopBoxWhisper(){
  boxWhisperTimers.forEach(clearTimeout);boxWhisperTimers=[];
  boxWhispers.forEach(function(audio){audio.onended=null;audio.pause();audio.currentTime=0;});
 }
 var phrases=[[0,'Lausche …'],[5,''],[38,'']];
 function progress(){
  if(done||!Number.isFinite(daisy.duration)||daisy.duration<=0)return;
  var t=daisy.currentTime,idx=0;
  // Flüstern wird unabhängig vom timeupdate-Event nach fünf Sekunden gestartet.
  for(var k=0;k<phrases.length;k++){if(t>=phrases[k][0])idx=k;else break}
  if(idx!==lastCue){lastCue=idx;wl.textContent=phrases[idx][1]}
  if(!ending)status.textContent='Die Melodie spielt …';
 }
 function finish(escaped){
  if(done)return;done=true;
  daisy.removeEventListener('ended',onSongEnd);
  daisy.removeEventListener('timeupdate',progress);
  daisy.removeEventListener('error',onAudioError);
  daisy.pause();daisy.currentTime=0;stopBoxWhisper();
  if(escapeTimer){clearTimeout(escapeTimer);escapeTimer=null;}
  if(escapeVoice){escapeVoice.pause();escapeVoice=null;}
  ov.classList.remove('on');document.body.classList.remove('musicBoxActive');
  S.locked=false;music.volume=previousMusicVolume;
  if(escaped){
   render('DIE SPIELUHR','Du reißt dich von der Melodie los. Ein stechender Schmerz bleibt zurück.<br><br><strong>−30 Blut.</strong> Aus der geschlossenen Spieluhr hörst du ein letztes Flüstern.',
    [['⬅ Zurück',kids]],'Kinderzimmer');
  }else{
   render('DIE SPIELUHR','Der letzte Ton verklingt. Der Deckel fällt zu. In das Holz ist eingeritzt:<div class="note">DIE LETZTE VORSTELLUNG WARTET.</div>',
    [['⬅ Zurück',kids]],'Kinderzimmer');
  }
  updateHudOnly();
function completeSongEnd(){
    if(done||ending||!whisperFinished)return;
 
   ending=true;status.textContent='Die Musik verstummt. Etwas kommt näher …';wl.textContent='';
  if(!scared){scared=true;stopBoxWhisper();dollJumpscare(true,"spieluhr-neuer-schrei.mp3");loseSanity(7)}
  setTimeout(function(){finish(false)},1000);
 }
 function onSongEnd(){
  if(done||ending)return;
  // Der dritte Flüstersatz muss zu Ende spielen, auch wenn Daisy Bell früher endet.
  daisy.pause();pendingSongEnd=true;
  if(whisperFinished){completeSongEnd();return;}
  status.textContent='Die Melodie verstummt … Romina flüstert noch.';
  if(!whisperStarted)startBoxWhisper();
  // Nur technische Notbremse bei fehlerhaften Audio-Dateien.
boxWhisperTimers.push(setTimeout(function(){
    if(whisperFinished){
        completeSongEnd();
    }else{
        status.textContent='Romina flüstert noch ...';
    }
},25000));
 }
 function onAudioError(){
  if(done)return;
  stopBoxWhisper();
  status.textContent='Die Audiodatei konnte nicht geladen werden.';
  wl.textContent='Die Spieluhr ist verstummt.';
  // Bei einem technischen Fehler darf niemand eingesperrt bleiben oder Blut verlieren.
  escapeBtn.textContent='Ohne Blutverlust zurück';
  escapeBtn.onclick=function(){finish(false)};
 }
 escapeBtn.textContent='🩸 Vorzeitig verlassen (30 Blut)';
 escapeBtn.onclick=function(){
  if(done||ending)return;
  if(S.blood<30){status.textContent='Du hast nicht genug Blut, um dich loszureißen. Die Melodie hält dich fest.';return}
  if(!confirm('Willst du die Spieluhr vorzeitig verlassen? Das kostet unwiderruflich 30 Blut.'))return;
  S.blood-=30;
  if(S.blood<=50)document.body.classList.add('bloodWeak');
  loseSanity(5);
  // Silas spricht erst vollständig; danach folgt eine halbe Sekunde Stille und der Schreck.
  ending=true;
  daisy.pause();daisy.currentTime=0;stopBoxWhisper();
  status.textContent='Die Spieluhr verstummt. Eine Stimme antwortet …';
  wl.textContent='';
  escapeBtn.disabled=true;
  escapeVoice=new Audio('silas-spieluhr-freikauf.mp3');
  escapeVoice.volume=.65;
  var voiceFinished=false;
  function afterVoice(){
   if(voiceFinished||done)return;
   voiceFinished=true;
   escapeTimer=setTimeout(function(){
    if(done)return;
    status.textContent='';
    dollJumpscare(true,'spieluhr-neuer-schrei.mp3');
    // Der Nachhall darf weiterlaufen, während die Spieluhr wieder verlassen wird.
    escapeTimer=setTimeout(function(){finish(true)},1100);
   },500);
  }
  escapeVoice.addEventListener('ended',afterVoice,{once:true});
  escapeVoice.addEventListener('error',afterVoice,{once:true});
  escapeVoice.play().catch(afterVoice);
  // Falls ein Browser das End-Ereignis nicht liefert, bleibt die Szene nicht hängen.
  escapeTimer=setTimeout(afterVoice,16000);
 };
 daisy.addEventListener('ended',onSongEnd);
 daisy.addEventListener('timeupdate',progress);
 daisy.addEventListener('error',onAudioError);
 wl.textContent='Lausche …';
 daisy.play().then(function(){boxWhisperTimers.push(setTimeout(startBoxWhisper,5000))}).catch(function(){
  if(done)return;
  status.textContent='Der Browser hat die Wiedergabe blockiert.';
  wl.textContent='Klicke, um die Spieluhr zu starten.';
  var b=document.createElement('button');b.textContent='Musik starten';
  b.onclick=function(){daisy.play().then(function(){boxWhisperTimers.push(setTimeout(startBoxWhisper,5000));b.remove()}).catch(onAudioError)};
  status.appendChild(b);
 });
}

/* Einmalige Bild-Enthüllung nach dem korrekt gelösten Fragmenträtsel. */
function portraitReveal(){
 if(S.flags.portraitScareSeen){portraitAftermath();return}
 S.flags.portraitScareSeen=true;
 S.locked=true;
 var el=document.getElementById("portraitScene");
 var cap=document.getElementById("portraitCaption");
 var vid=document.getElementById("portraitAnimation");
 var original=el.querySelector(".stageFrame > img");
 var jobs=[],finished=false,videoStarted=false;
 el.className="on";cap.textContent="";
 original.src="romina-silas-vor-dem-verschwinden.jpg";
 original.style.display="block";vid.style.display="none";
 vid.pause();try{vid.currentTime=0}catch(e){}
 function later(ms,fn){jobs.push(setTimeout(function(){if(!finished)fn()},ms))}
 function finish(){
  if(finished)return;
  finished=true;jobs.forEach(clearTimeout);
  vid.pause();vid.onended=null;vid.onerror=null;
  vid.style.display="none";original.style.display="block";
  el.className="";firstPuppeteerEncounter();
 }
 function jumpscareAfterVideo(){
  if(finished)return;
  vid.pause();vid.style.display="none";original.style.display="none";
  el.classList.add("attack");S.jumps++;
  playScareAudio("spieluhr-neuer-schrei.mp3",.40);
  later(850,function(){el.classList.add("blackout")});
  later(1650,finish);
 }
 function startVideo(){
  if(finished)return;
  videoStarted=true;
  original.style.display="none";vid.style.display="block";
  vid.onended=jumpscareAfterVideo;
  vid.onerror=jumpscareAfterVideo;
  try{vid.currentTime=0}catch(e){}
  var attempt=vid.play();
  if(attempt&&attempt.catch)attempt.catch(function(){
   // Some browsers reject delayed playback with sound: retry muted.
   vid.muted=true;
   var retry=vid.play();
   if(retry&&retry.catch)retry.catch(jumpscareAfterVideo);
  });
  // Safety net if the media does not emit an ended event.
  later(8000,jumpscareAfterVideo);
 }
 document.getElementById("portraitSceneSkip").onclick=finish;
 // Original portrait first, then the supplied animation, then the jumpscare.
 later(1400,startVideo);
}

 '<button class="primary" id="checkFragments">BILD PRÜFEN</button>'+
 '<button id="leaveFragments">Zurück</button></div>';

 document.getElementById("checkFragments").onclick=function(){
   if(S.pieces.length<6){
     wrong();
     return;

     return fragMotif(n).toLowerCase()
       .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
       .replace(/[^a-z0-9]/g,"");

     portraitReveal();

 };

}
